   交互逻辑
   ================================================================ */

/* ---- 课程展开/收起 ---- */
function toggleCourse(courseId) {
  const card = document.querySelector(`.course-card[data-course-id="${courseId}"]`);
  if (!card) return;
  card.classList.toggle('expanded');
  const header = card.querySelector('.course-card-header');
  const isExpanded = card.classList.contains('expanded');
  header.setAttribute('aria-expanded', isExpanded);
}

/* ---- 手动调整课程日期（计划完成 / 实际完成时间） ---- */
function updateCourseDate(courseId, field, value) {
  const course = data.courses.find(c => c.id === courseId);
  if (!course) return;
  course[field] = value;
  saveData(data);

  // 刷新该卡片日期输入的填充态（实际完成时间填入则高亮）
  const card = document.querySelector(`.course-card[data-course-id="${courseId}"]`);
  if (card) {
    const inp = card.querySelector(`.date-input[data-field="${field}"]`);
    if (inp) {
      inp.value = value || '';
      if (field === 'actualComplete') {
        if (value) inp.classList.add('filled'); else inp.classList.remove('filled');
      }
    }
  }
  showToast(field === 'actualComplete'
    ? (value ? '已记录实际完成时间' : '已清除实际完成时间')
    : '已更新计划完成日期');

  // 日期变化后刷新全年日历标记
  renderCalendar();
}

/* ---- 手动调整课程课时数量 ---- */
function updateCourseLessons(courseId) {
  const course = data.courses.find(c => c.id === courseId);
  if (!course) return;
  const input = document.querySelector('.lesson-count-input[data-course-id="' + courseId + '"]');
  if (!input) return;
  let n = parseInt(input.value, 10);
  if (isNaN(n) || n < 1) { showToast('请输入有效课时数（≥1）'); input.value = course.totalLessons; return; }
  if (n > 999) n = 999;
  if (n === course.totalLessons) { showToast('课时数未变化'); return; }

  // 保留已完成的勾选状态（已勾数不超过新总数）
  const done = countCompleted(course);
  course.totalLessons = n;
  course.lessons = genLessons(n, done === n, Math.min(done, n));
  // 若新课时下恰好全部完成且无实际完成时间，补记
  if (done >= n && !course.actualComplete) course.actualComplete = todayStr();

  saveData(data);
  renderStats();
  renderCourses();
  showToast(course.name + ' 课时已设为 ' + n);
}

/* ---- 手动调整考试截止日期 ---- */
function updateExamDate(value) {
  if (!value) return;
  data.examDate = value;
  saveData(data);
  renderCalendar();
  renderCountdown();
  showToast('已更新考试截止日期');
}

/* ---- 课时勾选 ---- */
function toggleLesson(courseId, lessonIdx) {
  const course = data.courses.find(c => c.id === courseId);
  if (!course) return;

  const lesson = course.lessons[lessonIdx];
  const wasComplete = countCompleted(course) === course.totalLessons;
  lesson.completed = !lesson.completed;

  // 课程完成时间以实际完成时间为准：达到 100% 时自动记录当日为实际完成时间；脱离完成则清除
  const nowComplete = countCompleted(course) === course.totalLessons;
  if (nowComplete && !wasComplete) {
    if (!course.actualComplete) course.actualComplete = todayStr();
  } else if (!nowComplete && wasComplete) {
    course.actualComplete = '';
  }

  // Update lastStudyDate
  const today = todayStr();
  course.lastStudyDate = today;

  // Add today to studyDays if not present
  if (!data.studyDays.includes(today)) {
    data.studyDays.push(today);
    data.studyDays.sort();
  }

  // Update total study hours (each lesson ~0.3h)
  data.totalStudyHours = Math.round((data.totalStudyHours + (lesson.completed ? 0.3 : -0.3)) * 10) / 10;
  if (data.totalStudyHours < 0) data.totalStudyHours = 0;

  saveData(data);

  // Update the specific lesson row
  const lessonList = document.getElementById('lessons-' + courseId);
  if (lessonList) {
    const rows = lessonList.querySelectorAll('.lesson-row');
    if (rows[lessonIdx]) {
      if (lesson.completed) {
        rows[lessonIdx].classList.add('checked');
        rows[lessonIdx].setAttribute('aria-checked', 'true');
      } else {
        rows[lessonIdx].classList.remove('checked');
        rows[lessonIdx].setAttribute('aria-checked', 'false');
      }
    }

    // Update mini progress
    const done = countCompleted(course);
    const miniLabel = lessonList.previousElementSibling;
    if (miniLabel) {
      miniLabel.textContent = '共 ' + course.totalLessons + ' 课时，已完成 ' + done + ' 课时';
    }
  }

  // Update the card header
  updateCourseCard(course);

  // Re-render stats & calendar
  renderStats();
  renderCalendar();

  // Show toast
  showToast(lesson.completed ? '已标记完成' : '已取消标记');
}

function updateCourseCard(course) {
  const pct = getPercentage(course);
  const done = countCompleted(course);
  const isComplete = pct >= 100;
  const dashOffset = CIRCUMFERENCE * (1 - pct / 100);

  const card = document.querySelector(`.course-card[data-course-id="${course.id}"]`);
  if (!card) return;

  // Update ring
  const ring = card.querySelector('[data-ring-id]');
  if (ring) {
    ring.setAttribute('stroke-dashoffset', dashOffset);
    ring.classList.remove('complete', 'zero');
    if (isComplete) ring.classList.add('complete');
    else if (pct === 0) ring.classList.add('zero');
  }

  // Update percentage text
  const pctEl = card.querySelector('[data-pct-id]');
  if (pctEl) pctEl.textContent = pct + '%';

  // Handle completion state
  if (isComplete && !card.classList.contains('completed')) {
    card.classList.add('completed');
    // Replace ring check
    const container = card.querySelector('.ring-container');
    const pctSpan = container.querySelector('.ring-percent');
    if (pctSpan) pctSpan.remove();
    const existingCheck = container.querySelector('.ring-check');
    if (!existingCheck) {
      const check = document.createElementNS('http://www.w3.org/2000/svg','svg');
      check.setAttribute('class','ring-check');
      check.setAttribute('width','22');
      check.setAttribute('height','22');
      check.setAttribute('viewBox','0 0 24 24');
      check.setAttribute('fill','none');
      check.innerHTML = '<circle cx="12" cy="12" r="11" fill="#10B981"/><path d="M7 12.5L10.5 16L17 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      container.appendChild(check);
    }
  }

  // Update meta text
  const metaItems = card.querySelectorAll('.course-meta-item');
  if (metaItems[0]) {
    metaItems[0].innerHTML = '<span class="meta-dot"></span>已完成 ' + done + ' / ' + course.totalLessons + ' 课时';
  }

  // Update deadline date inputs（完成时间以实际完成时间为准）
  const dateInputs = card.querySelectorAll('.date-input');
  dateInputs.forEach(inp => {
    const field = inp.getAttribute('data-field');
    if (field === 'expectedComplete') {
      inp.value = course.expectedComplete || '';
    } else if (field === 'actualComplete') {
      inp.value = course.actualComplete || '';
      if (course.actualComplete) inp.classList.add('filled');
      else inp.classList.remove('filled');
    }
  });

  // Update recent badge
  const daysAgo = getDaysAgo(course.lastStudyDate);
  const badge = card.querySelector('.recent-badge');
  if (badge) {
    badge.classList.remove('today','yesterday','older');
    if (daysAgo === 0) { badge.classList.add('today'); badge.textContent = '今天学习'; }
    else if (daysAgo === 1) { badge.classList.add('yesterday'); badge.textContent = '昨天学习'; }
    else { badge.classList.add('older'); badge.textContent = daysAgo + ' 天前学习'; }
  }
}

/* ---- 学习计时器（已由番茄时钟取代，保留 formatSeconds 供统计使用） ---- */
function formatSeconds(s) {
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  if (mins >= 60) {
    const hrs = Math.floor(mins / 60);
    const rm = mins % 60;
    return String(hrs).padStart(2,'0') + ':' + String(rm).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  }
  return String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}

/* ---- 每日打卡 ---- */
function dailyCheckIn() {
  const today = todayStr();
  if (data.lastCheckIn === today) return;

  data.lastCheckIn = today;
  if (!data.studyDays.includes(today)) {
    data.studyDays.push(today);
    data.studyDays.sort();
  }

  saveData(data);
  renderCheckin();
  renderStats();
  renderCalendar();

  // Confetti!
  spawnConfetti();
  showToast('打卡成功！已连续 ' + data.streak + ' 天');
}

/* ---- Toast ---- */
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ---- Confetti ---- */
function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#7C3AED','#10B981','#F59E0B','#EC4899','#3B82F6','#8B5CF6','#06B6D4'];

  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    const size = Math.random() * 8 + 4;
    const color = colors[Math.floor(Math.random() * colors.length)];

    particle.style.cssText = `
      position:absolute; width:${size}px; height:${size}px;
      background:${color}; border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      left:${Math.random() * 100}%; top:-20px; --rot:${360 + Math.random() * 720}deg;
      animation:confetti-fall ${Math.random() * 2 + 1.5}s ease-out forwards;
      animation-delay:${Math.random() * 0.3}s;
    `;
    container.appendChild(particle);

    setTimeout(() => particle.remove(), 2000);
  }
}

/* ---- 辅助 ---- */
function getDaysAgo(dateStr) {
  const d = new Date(dateStr + 'T00:00:00+08:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - d) / 86400000);
}

/* ---- Confetti Keyframes ---- */
const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes confetti-fall {
    0% { transform:translateY(0) rotate(0deg) scale(1); opacity:1; }
    100% { transform:translateY(100vh) rotate(var(--rot, 720deg)) scale(0); opacity:0; }
  }
`;
document.head.appendChild(styleSheet);

data.timerStartTs = null;

  data.pomoLastDate = todayStr();
}
saveData(data);

try { applyCourseColors(); } catch(e) { console.error('applyCourseColors 失败:', e); }

// 初始化渲染：带异常兜底，若首次渲染失败则尝试清除脏数据后用默认数据重试
try {
  renderAll();
} catch(e) {
  console.error('[初始化渲染失败] 尝试重置数据后重试:', e);
  try {
    localStorage.removeItem(STORAGE_KEY);
    data = getDefaultData();
    saveData(data);
    renderAll();
    console.warn('已重置为默认数据并重新渲染');
  } catch(e2) {
    console.error('[重置后仍失败]', e2);
    // 最后兜底：在日历容器显示可见错误提示
    const mc = document.getElementById('calendarMonths');
    if (mc) {
      mc.innerHTML = '<div style="padding:24px;text-align:center;color:#DC2626;font-size:14px;line-height:1.8;">'
        + '页面渲染异常，请尝试按 Ctrl+Shift+R 强制刷新，或清除浏览器缓存后重新打开。<br>'
        + '若问题持续，可在浏览器控制台执行 localStorage.removeItem(\'' + STORAGE_KEY + '\') 后刷新。'
        + '</div>';
    }
  }
}
